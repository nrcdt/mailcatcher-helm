{{- $gw := .Values.gateway }}
{{- if and $gw.enabled (or $gw.oidc.enabled $gw.jwt.enabled $gw.authorization.enabled) }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "mailcatcher.fullname" . }}
  labels:
    {{- include "mailcatcher.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "mailcatcher.fullname" . }}
  {{- with $gw.oidc }}
  {{- if .enabled }}
  oidc:
    provider:
      issuer: {{ .provider.issuer | quote }}
      {{- with .provider.authorizationEndpoint }}
      authorizationEndpoint: {{ . | quote }}
      {{- end }}
      {{- with .provider.tokenEndpoint }}
      tokenEndpoint: {{ . | quote }}
      {{- end }}
    clientID: {{ .clientID | quote }}
    clientSecret:
      name: {{ include "mailcatcher.oidcSecretName" $ | quote }}
    redirectURL: {{ .redirectURL | quote }}
    {{- with .logoutPath }}
    logoutPath: {{ . | quote }}
    {{- end }}
    {{- with .cookieDomain }}
    cookieDomain: {{ . | quote }}
    {{- end }}
    {{- if .forwardAccessToken }}
    forwardAccessToken: true
    {{- end }}
    {{- if .refreshToken }}
    refreshToken: true
    {{- end }}
    {{- with .scopes }}
    scopes:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .resources }}
    resources:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $gw.jwt }}
  {{- if .enabled }}
  jwt:
    {{- if .optional }}
    optional: true
    {{- end }}
    providers:
      {{- range .providers }}
      - name: {{ .name | quote }}
        issuer: {{ .issuer | quote }}
        {{- with .audiences }}
        audiences:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if and .remoteJWKS .remoteJWKS.uri }}
        remoteJWKS:
          uri: {{ .remoteJWKS.uri | quote }}
        {{- else }}
        localJWKS:
          type: Inline
          inline: {{ .localJWKS | quote }}
        {{- end }}
        {{- with .claimToHeaders }}
        claimToHeaders:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .extractFrom }}
        extractFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .recomputeRoute }}
        recomputeRoute: true
        {{- end }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- with $gw.authorization }}
  {{- if .enabled }}
  authorization:
    defaultAction: {{ .defaultAction | default "Deny" }}
    rules:
      {{- toYaml .rules | nindent 6 }}
  {{- end }}
  {{- end }}
{{- end }}
