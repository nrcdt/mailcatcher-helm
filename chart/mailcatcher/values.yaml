# Default values for mailcatcher.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/nrcdt/mailcatcher-helm
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""


# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: {}
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000


# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
http_service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

smtp_service:
  type: ClusterIP
  port: 25

networkPolicy:
  enabled: true
  allowExternal: true

commonLabels: {}
# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  htpasswd:
    enabled: false
    password:
    user:

  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# This block is for setting up the Gateway API HTTPRoute as an alternative to Ingress.
# Requires a Gateway API implementation (e.g., Envoy Gateway) to be installed in the cluster.
# The HTTPRoute references a parent Gateway that must already exist.
gateway:
  enabled: false
  annotations: {}

  # Parent Gateway reference(s) - the Gateway must already exist in the cluster
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system

  # Hostnames to match on
  hostnames:
    - mailcatcher.example.com

  # Unauthenticated health check route for external checkers (e.g. an upstream
  # load balancer or uptime monitor) that cannot log in. Creates a second HTTPRoute
  # without SecurityPolicy that matches only <path> exactly and rewrites it to
  healthRoute:
    enabled: false
    path: /healthz

  # OIDC redirect flow (browser-based login via Envoy Gateway SecurityPolicy)
  # Users are redirected to the IdP login page and back after authentication.
  oidc:
    enabled: false
    provider:
      issuer: ""                      # e.g. https://keycloak.example.com/realms/myrealm
      # Optional: if empty, Envoy Gateway discovers the endpoints via <issuer>/.well-known/openid-configuration
      authorizationEndpoint: ""       # e.g. https://keycloak.example.com/realms/myrealm/protocol/openid-connect/auth
      tokenEndpoint: ""               # e.g. https://keycloak.example.com/realms/myrealm/protocol/openid-connect/token
    clientID: ""
    clientSecret: ""                  # Inline secret value (chart creates the Secret)
    existingSecret: ""                # OR name of a pre-existing Secret containing key "client-secret" (takes precedence)
    redirectURL: ""                   # e.g. https://mailcatcher.example.com/oauth2/callback
    logoutPath: ""                    # e.g. /logout - path that clears the session cookies
    cookieDomain: ""                  # e.g. example.com - share the session cookie across subdomains
    forwardAccessToken: false         # Forward the access token as "Authorization: Bearer" header to the backend
    refreshToken: false               # Automatically refresh the access token using the refresh token
    scopes:
      - openid
      - email
      - profile
    resources: []                     # Resource indicators (RFC 8707) sent to the IdP
    # Additional fields passed through verbatim to SecurityPolicy spec.oidc
    # (e.g. cookieNames, defaultTokenTTL, defaultRefreshTokenTTL, passThroughAuthHeader)
    extra: {}

  # JWT/JWKS validation (stateless token validation for API/programmatic access via Envoy Gateway SecurityPolicy)
  # Validates JWTs already present in the request using a remote or inline JWKS.
  jwt:
    enabled: false
    # If true, requests without a JWT are allowed through (invalid JWTs are still rejected).
    # Useful together with OIDC or authorization rules.
    optional: false
    providers:
      - name: default
        issuer: ""                    # e.g. https://keycloak.example.com/realms/myrealm
        audiences: []                 # e.g. ["mailcatcher"]
        remoteJWKS:
          uri: ""                     # e.g. https://keycloak.example.com/realms/myrealm/protocol/openid-connect/certs
        # Alternative to remoteJWKS: inline JWKS JSON string
        localJWKS: ""
        # Copy JWT claims into request headers for the backend
        claimToHeaders: []
        #  - header: x-user-email
        #    claim: email
        # Where to look for the token (default: Authorization Bearer header)
        extractFrom: {}
        #  headers:
        #    - name: x-api-token
        #  cookies:
        #    - access_token
        #  params:
        #    - token
        recomputeRoute: false

  # Authorization rules (Envoy Gateway SecurityPolicy spec.authorization)
  # Allows restricting access based on JWT claims/scopes or client IP ranges.
  authorization:
    enabled: false
    defaultAction: Deny               # Deny or Allow
    rules: []
    #  - name: allow-mailcatcher-users
    #    action: Allow
    #    principal:
    #      jwt:
    #        provider: default        # must match a gateway.jwt.providers[].name
    #        claims:
    #          - name: groups
    #            valueType: StringArray
    #            values: ["mailcatcher-users"]
    #  - name: allow-office
    #    action: Allow
    #    principal:
    #      clientCIDRs:
    #        - 10.0.0.0/8

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  # Vertical Pod Autoscaler - requires the VPA controller to be installed in the cluster
  # https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
  vpa:
    enabled: false
    # Update mode: "Off", "Initial", "Recreate", "InPlaceOrRecreate", or "Auto"
    mode: InPlaceOrRecreate
    minAllowed:
      cpu: 10m
      memory: 50Mi
    # maxAllowed defaults to resources.limits if not set
    maxAllowed: {}
    #   cpu: 100m
    #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
